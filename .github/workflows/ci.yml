name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build -w backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci_dummy?sslmode=disable

      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_API_URL: https://ci-dummy.example.com
